frr version 10.0
frr defaults traditional
hostname r2
!
interface eth1
 ip address 10.1.2.2/30
!
interface eth2
 ip address 10.2.3.1/30
!
interface eth3
 ip address 10.2.4.1/30
!
router ospf
 network 10.1.2.0/30 area 0
 network 10.2.3.0/30 area 0
 network 10.2.4.0/30 area 0
!
router rip
 version 2
 network 10.1.2.0/30
 network 10.2.3.0/30
 network 10.2.4.0/30
 no auto-summary
!
line vty
!
