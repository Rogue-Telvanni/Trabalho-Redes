frr version 10.0
frr defaults traditional
hostname r1
!
interface eth1
 ip address 10.0.1.2/30
!
interface eth2
 ip address 10.1.2.1/30
!
interface eth3
 ip address 192.168.1.1/24
!
router ospf
 network 10.0.1.0/30 area 0
 network 10.1.2.0/30 area 0
 network 192.168.1.0/24 area 0
!
router rip
 version 2
 network 10.0.1.0/30
 network 10.1.2.0/30
 network 192.168.1.0/24
 no auto-summary
!
line vty
!
