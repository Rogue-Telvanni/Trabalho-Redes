frr version 10.0
frr defaults traditional
hostname r5
!
interface eth1
 ip address 10.4.5.2/30
!
interface eth2
 ip address 192.168.20.1/24
!
router ospf
 network 10.4.5.0/30 area 0
 network 192.168.20.0/24 area 0
!
router rip
 version 2
 network 10.4.5.0/30
 network 192.168.20.0/24
 no auto-summary
!
line vty
!
